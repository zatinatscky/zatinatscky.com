# Устарело для продакшена: hiphop входит в корневой docker-compose.yml.
# Этот файл оставлен только для изолированного запуска из каталога hiphop/.
# На VPS: cd ~/zatinatscky && docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: hiphop-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hiphop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-hiphop}
    volumes:
      - hiphop_pgdata:/var/lib/postgresql/data
    networks:
      - hiphop_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: hiphop-web
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-hiphop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-hiphop}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
    expose:
      - "8000"
    networks:
      - hiphop_internal
      # Общая сеть с Caddy IVAN (имя = каталог compose IVAN + _default).
      - ivan_proxy

networks:
  hiphop_internal:
  ivan_proxy:
    external: true
    name: ${IVAN_NETWORK:-zatinatscky_default}

volumes:
  hiphop_pgdata:
